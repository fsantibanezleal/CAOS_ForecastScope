name: CI
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests
      - run: python -m pytest tests/test_public_api.py tests/test_forecasters.py tests/test_validated_combination.py
      - run: python -m build
      - run: python -m twine check dist/*
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUMBA_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,diagnostics]'
      - run: python -m pytest tests
