[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastscope"
version = "0.1.0"
description = "Finite-prefix forecasting, temporal forecast combinations and sequence diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Felipe Santibáñez-Leal"}]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
diagnostics = [
  "scipy>=1.15,<2", "statsmodels>=0.14.6,<0.15", "arch>=8,<9",
  "ruptures>=1.1.10,<2", "EMD-signal>=1.9,<2", "PyWavelets>=1.8,<2",
  "antropy>=0.2.2,<0.3", "nolds==0.6.3", "hurst==0.0.5", "MFDFA==0.4.3",
  "pycatch22>=0.4.5,<0.5", "stumpy>=1.14.1,<2", "scikit-learn>=1.9,<2",
]
dev = ["pytest>=8", "ruff>=0.15,<0.17", "build", "twine"]

[project.urls]
Repository = "https://github.com/fsantibanezleal/CAOS_ForecastScope"
Issues = "https://github.com/fsantibanezleal/CAOS_ForecastScope/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["E741"]
